[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hwm-director-antmaze"
version = "0.1.0"
description = "Director vs hierarchical world models on AntMaze."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "gymnasium>=1.2,<2",
    "gymnasium-robotics==1.4.2",
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
