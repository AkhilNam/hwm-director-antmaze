[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hwm-director-antmaze"
version = "0.1.0"
description = "Milestone 1: AntMaze environment inspection for a future Director vs HWM comparison."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "gymnasium>=1.2,<2",
    "gymnasium-robotics==1.4.2",
    "numpy>=1.21",
]

[tool.setuptools.packages.find]
where = ["src"]
